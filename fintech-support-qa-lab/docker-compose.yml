services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fintech_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d fintech_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://lab:lab_password@db:5432/fintech_lab

volumes:
  postgres_data:
