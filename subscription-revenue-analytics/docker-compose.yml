services:
  db:
    image: postgres:16-alpine
    container_name: subscription-bi-postgres
    environment:
      POSTGRES_DB: subscription_bi
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics_local_only
    ports:
      - "5432:5432"
    volumes:
      - subscription_bi_data:/var/lib/postgresql/data
      - ./:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d subscription_bi"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  subscription_bi_data:
