<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — страница не найдена</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:grid;place-items:center;background:#060A13;color:#E9EFFA;font-family:'JetBrains Mono',ui-monospace,monospace;text-align:center;padding:24px;
      background-image:radial-gradient(600px 320px at 70% 10%,rgba(77,163,255,.14),transparent 70%),radial-gradient(500px 300px at 20% 90%,rgba(183,156,255,.12),transparent 70%),linear-gradient(rgba(77,163,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(77,163,255,.06) 1px,transparent 1px);
      background-size:auto,auto,44px 44px,44px 44px}
    .log{font-size:12.5px;line-height:2;color:#7C8CA8;margin-bottom:18px;text-align:left;display:inline-block}
    .log .err{color:#FF6B6B}.log .ok{color:#3DDC84}
    h1{font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(72px,16vw,140px);line-height:1;background:linear-gradient(100deg,#4DA3FF,#B79CFF 60%,#35D6E8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:14px}
    p{color:#A7B4CC;font-size:14px;margin-bottom:28px}
    a{display:inline-flex;align-items:center;gap:10px;padding:13px 24px;border-radius:12px;background:linear-gradient(120deg,#4DA3FF,#B79CFF);color:#05101E;font-weight:500;font-size:13px;text-decoration:none;box-shadow:0 10px 28px rgba(77,163,255,.3);transition:transform .2s,box-shadow .2s}
    a:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(183,156,255,.35)}
    ::selection{background:#4DA3FF;color:#060A13}
  </style>
</head>
<body>
  <main>
    <div class="log">
      <span>$ GET /requested-page</span><br>
      <span class="err">✗ 404 — route not found</span><br>
      <span class="ok">✓ fallback: главная доступна</span>
    </div>
    <h1>404</h1>
    <p>Такой страницы нет. Возможно, её переместили или удалили.</p>
    <a href="/portfolio/">← вернуться на главную</a>
  </main>
</body>
</html>
