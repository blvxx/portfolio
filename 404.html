<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — страница не найдена</title>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #0f172a; color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; }
    .wrap { padding: 24px; }
    h1 { font-size: 80px; margin: 0; background: linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #94a3b8; font-size: 16px; }
    a { display: inline-block; margin-top: 16px; padding: 10px 22px; border-radius: 8px; background: linear-gradient(135deg, #1e40af, #6d28d9); color: #fff; text-decoration: none; font-weight: 500; }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <p>Такой страницы нет. Возможно, её переместили или удалили.</p>
    <a href="./">Вернуться на главную</a>
  </div>
</body>
</html>
