name: FinTech QA Engineering Platform

on:
  push:
    paths:
      - "fintech-qa-platform/**"
      - ".github/workflows/fintech-qa-platform.yml"
  pull_request:
    paths:
      - "fintech-qa-platform/**"
      - ".github/workflows/fintech-qa-platform.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fintech-qa-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fintech-qa-platform/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check services tests
      - name: Automated tests
        run: pytest --junitxml=reports/junit.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fintech-qa-platform-junit
          path: fintech-qa-platform/reports/junit.xml
          if-no-files-found: ignore

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start services
        run: docker compose -f fintech-qa-platform/docker-compose.yml up --build -d
      - name: Verify payment-to-ledger flow
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f fintech-qa-platform/docker-compose.yml"
          cleanup() { $COMPOSE down -v; }
          trap cleanup EXIT

          for attempt in $(seq 1 40); do
            if curl --silent --fail http://localhost:8000/health/ready >/dev/null && \
               curl --silent --fail http://localhost:8001/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              $COMPOSE logs
              exit 1
            fi
            sleep 2
          done

          response=$(curl --silent --show-error --fail \
            -H "Content-Type: application/json" \
            -d '{"idempotency_key":"ci-payment-0001","customer_account":"ci-customer","merchant_account":"ci-merchant","amount_minor":2500,"currency":"RUB"}' \
            http://localhost:8000/payments)
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["status"] == "posted"; assert d["duplicate"] is False' <<< "$response"

          retry=$(curl --silent --show-error --fail \
            -H "Content-Type: application/json" \
            -d '{"idempotency_key":"ci-payment-0001","customer_account":"ci-customer","merchant_account":"ci-merchant","amount_minor":2500,"currency":"RUB"}' \
            http://localhost:8000/payments)
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["duplicate"] is True' <<< "$retry"

          customer=$(curl --silent --show-error --fail http://localhost:8001/accounts/ci-customer/balance)
          merchant=$(curl --silent --show-error --fail http://localhost:8001/accounts/ci-merchant/balance)
          python -c 'import json,sys; c=json.loads(sys.argv[1]); m=json.loads(sys.argv[2]); assert c["balance_minor"] == -2500; assert m["balance_minor"] == 2500; assert c["balance_minor"] + m["balance_minor"] == 0' "$customer" "$merchant"
          echo "Payment-to-ledger Compose smoke test passed."
