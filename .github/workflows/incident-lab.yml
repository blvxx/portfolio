name: Incident Lab Log Analyzer

on:
  push:
    paths:
      - 'incident-lab/**'
  pull_request:
    paths:
      - 'incident-lab/**'
  workflow_dispatch:

jobs:
  analyzer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run analyzer
        run: python incident-lab/scripts/analyze_incident.py
      - name: Run pattern tests
        working-directory: incident-lab/scripts
        run: python -m unittest test_patterns -v
