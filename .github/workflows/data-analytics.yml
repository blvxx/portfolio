name: Data Analytics

on:
  push:
    paths:
      - "data-analytics/**"
      - ".github/workflows/data-analytics.yml"
  pull_request:
    paths:
      - "data-analytics/**"
      - ".github/workflows/data-analytics.yml"
  workflow_dispatch:

jobs:
  analytics-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: data-analytics
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: data-analytics/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run analytics pipeline
        run: python src/analysis.py --input data/orders.csv --output /tmp/analytics-reports
