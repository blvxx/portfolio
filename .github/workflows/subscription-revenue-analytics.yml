name: Subscription Revenue Analytics

on:
  push:
    paths:
      - "subscription-revenue-analytics/**"
      - ".github/workflows/subscription-revenue-analytics.yml"
  pull_request:
    paths:
      - "subscription-revenue-analytics/**"
      - ".github/workflows/subscription-revenue-analytics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-analytics:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: subscription_bi
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics -d subscription_bi"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: analytics_ci_only
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: analytics
      PGDATABASE: subscription_bi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load schema and synthetic fixture
        working-directory: subscription-revenue-analytics
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/00_schema.sql
          psql -v ON_ERROR_STOP=1 -f sql/01_seed.sql

      - name: Build PostgreSQL analytical marts
        working-directory: subscription-revenue-analytics
        run: psql -v ON_ERROR_STOP=1 -f sql/02_marts.sql

      - name: Run data-quality and reconciliation assertions
        working-directory: subscription-revenue-analytics
        run: psql -v ON_ERROR_STOP=1 -f sql/03_quality_checks.sql

      - name: Export BI-ready aggregate outputs
        working-directory: subscription-revenue-analytics
        run: |
          mkdir -p artifacts
          psql -v ON_ERROR_STOP=1 -c "\copy (SELECT * FROM bi_mart_monthly_kpis ORDER BY month_start) TO 'artifacts/monthly_kpis.csv' WITH (FORMAT csv, HEADER true)"
          psql -v ON_ERROR_STOP=1 -c "\copy (SELECT * FROM bi_mart_cohort_retention ORDER BY cohort_month, month_number) TO 'artifacts/cohort_retention.csv' WITH (FORMAT csv, HEADER true)"
          psql -v ON_ERROR_STOP=1 -c "\copy (SELECT * FROM bi_mart_channel_performance ORDER BY month_start, acquisition_channel, region) TO 'artifacts/channel_performance.csv' WITH (FORMAT csv, HEADER true)"

      - name: Upload aggregate reports
        uses: actions/upload-artifact@v4
        with:
          name: subscription-bi-aggregate-exports
          path: subscription-revenue-analytics/artifacts/*.csv
          if-no-files-found: error
          retention-days: 30
