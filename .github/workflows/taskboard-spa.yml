name: Taskboard SPA

on:
  push:
    branches: [main]
    paths:
      - "taskboard-spa-src/**"
      - ".github/workflows/taskboard-spa.yml"
  pull_request:
    paths:
      - "taskboard-spa-src/**"
      - ".github/workflows/taskboard-spa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taskboard-spa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: taskboard-spa-src
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Type-check application and build configuration
        working-directory: taskboard-spa-src
        run: npm run typecheck

      - name: Run domain unit tests
        working-directory: taskboard-spa-src
        run: npm test

      - name: Build production bundle
        working-directory: taskboard-spa-src
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: workboard-taskboard-spa
          path: taskboard-spa-src/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish static SPA to GitHub Pages branch content
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebase the generated bundle onto the latest main revision. Other
          # profile/README commits may land while the build is running.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf taskboard-spa
            mkdir -p taskboard-spa
            cp -R taskboard-spa-src/dist/. taskboard-spa/
            touch taskboard-spa/.nojekyll
            git add taskboard-spa taskboard-spa-src/package-lock.json

            if git diff --cached --quiet; then
              echo "Published bundle is already up to date."
              exit 0
            fi

            git commit -m "chore(taskboard): publish SPA build [skip ci]"
            if git push origin HEAD:main; then
              echo "Published Taskboard SPA successfully."
              exit 0
            fi

            echo "main moved during push attempt ${attempt}; refreshing and retrying."
          done

          echo "Could not publish after five concurrent-update retries."
          exit 1
