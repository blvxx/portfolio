name: Customer Retention Analytics

on:
  push:
    paths:
      - "customer-retention-analytics/**"
      - ".github/workflows/customer-retention-analytics.yml"
  pull_request:
    paths:
      - "customer-retention-analytics/**"
      - ".github/workflows/customer-retention-analytics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-retention-analytics
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: customer-retention-analytics/pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile application and modules
        run: python -m compileall -q app.py scripts src
      - name: Run tests
        run: pytest
