name: Support Engineering Lab

on:
  push:
    paths:
      - "support-engineering-lab/**"
      - ".github/workflows/support-engineering-lab.yml"
  pull_request:
    paths:
      - "support-engineering-lab/**"
      - ".github/workflows/support-engineering-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triage-tests:
    name: Log triage tests and sample analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s support-engineering-lab/tests -v
      - name: Generate sample triage report
        run: |
          mkdir -p support-engineering-lab/reports
          python support-engineering-lab/scripts/log_triage.py \
            support-engineering-lab/sample-logs/system.log \
            support-engineering-lab/sample-logs/nginx-error.log \
            --format json \
            > support-engineering-lab/reports/triage-report.json
      - name: Upload triage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-engineering-lab-triage
          path: support-engineering-lab/reports/triage-report.json
          if-no-files-found: warn
          retention-days: 14
