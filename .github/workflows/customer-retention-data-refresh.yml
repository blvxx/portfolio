name: Retail Dataset Analysis

on:
  push:
    branches: ["main"]
    paths:
      - "customer-retention-analytics/scripts/**"
      - "customer-retention-analytics/sql/**"
      - "customer-retention-analytics/src/retail_analytics/**"
      - "customer-retention-analytics/tests/**"
      - ".github/workflows/customer-retention-data-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retail-data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-retention-analytics
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: customer-retention-analytics/pyproject.toml

      - name: Install analytics dependencies
        run: python -m pip install -e ".[dev]"

      - name: Download official UCI workbook
        run: python scripts/download_data.py

      - name: Build aggregate-only public report
        run: python scripts/build_public_report.py

      - name: Run analysis unit tests
        run: pytest

      - name: Upload aggregate report artifact
        uses: actions/upload-artifact@v4
        with:
          name: uci-online-retail-public-analysis
          path: |
            customer-retention-analytics/docs/generated/
          if-no-files-found: error
          retention-days: 90

      - name: Commit aggregate outputs with rebase-safe push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A customer-retention-analytics/docs/generated/

          if git diff --cached --quiet; then
            echo "No generated aggregate changes to commit."
            exit 0
          fi

          git commit -m "data: refresh aggregate UCI retail analysis [skip ci]"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}: rebasing generated report on latest main."
            git fetch origin main
            git rebase FETCH_HEAD

            if git push origin HEAD:main; then
              echo "Generated aggregate outputs published."
              exit 0
            fi

            sleep 2
          done

          echo "Could not publish generated outputs after three rebase attempts." >&2
          exit 1
