name: Fintech Support QA Lab

on:
  push:
    paths:
      - "fintech-support-qa-lab/**"
      - ".github/workflows/fintech-support-qa-lab.yml"
  pull_request:
    paths:
      - "fintech-support-qa-lab/**"
      - ".github/workflows/fintech-support-qa-lab.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fintech_lab_test
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab -d fintech_lab_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: fintech-support-qa-lab
    env:
      TEST_DATABASE_URL: postgresql+psycopg://lab:lab_password@localhost:5432/fintech_lab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fintech-support-qa-lab/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
