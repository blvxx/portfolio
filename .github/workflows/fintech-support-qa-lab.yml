name: Fintech Support QA Lab

on:
  push:
    paths:
      - "fintech-support-qa-lab/**"
      - ".github/workflows/fintech-support-qa-lab.yml"
  pull_request:
    paths:
      - "fintech-support-qa-lab/**"
      - ".github/workflows/fintech-support-qa-lab.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fintech-support-qa-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fintech-support-qa-lab/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
