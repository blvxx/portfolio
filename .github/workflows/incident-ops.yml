name: Incident Operations Lab

on:
  push:
    paths:
      - "incident-lab/**"
      - ".github/workflows/incident-ops.yml"
  pull_request:
    paths:
      - "incident-lab/**"
      - ".github/workflows/incident-ops.yml"

jobs:
  incident-lab:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run incident lab unit tests
        run: python -m unittest discover -s incident-lab/scripts -v
      - name: Run unified diagnostics CLI
        run: python incident-lab/scripts/incident_ops.py all
      - name: Verify report artifacts
        run: |
          test -s incident-lab/reports/reconciliation_findings.csv
          test -s incident-lab/reports/reconciliation_report.html
          test -s incident-lab/reports/incident_summary.json
          test -s incident-lab/reports/incident_summary.html
