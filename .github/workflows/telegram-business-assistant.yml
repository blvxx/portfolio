name: Telegram Business Assistant

on:
  push:
    paths:
      - "telegram-business-assistant/**"
      - ".github/workflows/telegram-business-assistant.yml"
  pull_request:
    paths:
      - "telegram-business-assistant/**"
      - ".github/workflows/telegram-business-assistant.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-business-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: telegram-business-assistant/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test suite
        run: pytest -q
