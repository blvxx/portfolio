name: Booking API QA Tests
on:
  push:
    paths:
      - "qa-cases/api-contract-negative/**"
  pull_request:
    paths:
      - "qa-cases/api-contract-negative/**"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-cases/api-contract-negative
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qa-cases/api-contract-negative/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: pytest -v --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-api-qa-junit
          path: qa-cases/api-contract-negative/pytest-report.xml
