[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-retention-analytics"
version = "1.0.0"
description = "Retail sales, customer retention and RFM analysis using the UCI Online Retail dataset."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
  "openpyxl>=3.1"
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36", "plotly>=5.22"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
